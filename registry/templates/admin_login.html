<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Администратор</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f4f3ef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            background: #fff;
            border: 0.5px solid rgba(0,0,0,0.15);
            border-radius: 12px;
            padding: 2rem 2rem 2.5rem;
            width: 100%;
            max-width: 360px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #1a1a18;
        }

        .sub {
            font-size: 0.825rem;
            color: #888;
            margin-bottom: 1.75rem;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 4px;
            margin-top: 1rem;
        }

            label:first-of-type {
                margin-top: 0;
            }

        input {
            width: 100%;
            padding: 0.65rem 0.875rem;
            border: 0.5px solid rgba(0,0,0,0.18);
            border-radius: 6px;
            background: #f4f3ef;
            color: #1a1a18;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

            input:focus {
                outline: none;
                border-color: #2d7a56;
                box-shadow: 0 0 0 3px rgba(45,122,86,0.12);
            }

        .error {
            margin-top: 1rem;
            padding: 0.6rem 0.875rem;
            background: #fdf0f0;
            color: #8b2020;
            border: 0.5px solid #e07070;
            border-radius: 6px;
            font-size: 0.825rem;
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.7rem;
            background: #1a4f3a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
        }

            button:hover {
                opacity: 0.87;
            }
    </style>
</head>
<body>
    <div class="card">
        <h1>Вход в систему</h1>
        <p class="sub">Панель администратора</p>

        <form method="post" action="/admin/login">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
